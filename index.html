<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spot It! English Vocabulary</title>
<style>
:root{--bg1:#ffe66d;--bg2:#ff9ecb;--bg3:#7fd8ff;--ink:#3b2a6b;--card:#ffffff;--ok:#22b04b;--bad:#e5384f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#3b2a6b}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden}
body{font-family:"Fredoka","Baloo 2","Trebuchet MS","Comic Sans MS",system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--bg1),var(--bg2) 50%,var(--bg3));user-select:none;-webkit-user-select:none}
#app{height:100%;display:grid;grid-template-rows:auto 56px 1fr;gap:6px;padding:10px 16px 12px}
header{display:flex;align-items:center;gap:16px}
h1{margin:0;font-size:clamp(20px,3.4vh,34px);white-space:nowrap}
.pill{background:#fff;border-radius:999px;padding:4px 16px;font-weight:700;font-size:clamp(15px,2.6vh,24px);box-shadow:0 3px 0 rgba(0,0,0,.12);white-space:nowrap}
.prog{flex:1;height:clamp(14px,2.4vh,22px);background:#fff;border-radius:99px;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.15)}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff7a59,#ffcf3f,#43d17a);border-radius:99px;transition:width .5s}
#banner{align-self:center;justify-self:center;min-width:min(420px,90%);text-align:center;border-radius:16px;font-weight:800;font-size:clamp(18px,3.6vh,34px);padding:4px 24px;color:#fff;opacity:0;transform:scale(.8);transition:.2s}
#banner.show{opacity:1;transform:scale(1)}
#banner.ok{background:var(--ok)}#banner.bad{background:var(--bad)}
#banner small{display:block;font-size:.55em;font-weight:600;line-height:1}
#hint{position:absolute;left:0;right:0;text-align:center;font-weight:600}
#cards{display:flex;justify-content:center;align-items:center;gap:3vw;min-height:0}
.card{--d:min(46vw,calc(100dvh - 150px));width:var(--d);height:var(--d);border-radius:50%;background:var(--card);position:relative;box-shadow:0 0 0 8px #fff,0 0 0 13px #ff7a59,0 14px 30px rgba(0,0,0,.25)}
.pic{position:absolute;padding:0;border:3px solid #fff;background:#fff;border-radius:14%;overflow:hidden;cursor:pointer;box-shadow:none;transition:filter .15s,box-shadow .15s}
.pic img{width:100%;height:100%;display:block;pointer-events:none}
.pic:hover{filter:brightness(1.08)}
.pic.sel{box-shadow:0 0 0 5px #ffb300,0 0 22px 8px #ffd54f;z-index:5}
.pic.ok{box-shadow:0 0 0 6px var(--ok),0 0 26px 10px #7dff9f;z-index:6}
.pic.bad{box-shadow:0 0 0 6px var(--bad),0 0 20px 8px #ff8a98;animation:sh .4s}
@keyframes sh{25%{translate:-6px}75%{translate:6px}}
#end{position:fixed;inset:0;background:rgba(59,42,107,.88);display:none;align-items:center;justify-content:center;flex-direction:column;color:#fff;text-align:center;z-index:20}
#end.show{display:flex}
#end h2{font-size:clamp(32px,7vh,64px);margin:0 0 8px}#end p{font-size:clamp(20px,4vh,36px);margin:4px 0 18px}
#end button{font:inherit;font-size:clamp(18px,3.4vh,30px);font-weight:800;border:0;border-radius:999px;padding:10px 36px;background:#ffd54f;color:var(--ink);cursor:pointer;box-shadow:0 5px 0 #c99a00}
</style></head><body>
<div id="app">
<header><h1>Spot It!</h1><div class="pill">Round <span id="rn">1</span> / 15</div><div class="prog"><i id="bar"></i></div><div class="pill">Score: <span id="sc">0</span></div></header>
<div id="banner"></div>
<main id="cards"><div class="card" id="A"></div><div class="card" id="B"></div></main>
</div>
<div id="end"><h2>Great job!</h2><p id="fin"></p><button id="again">Play again</button></div>

      const W=a>=1?s:s*a,H=a>=1?s/a:s,r=Math.hypot(W,H)/2*.82;
      let placed=false;
      for(let k=0;k<300&&!placed;k++){
        const x=rnd(0,100),y=rnd(0,100);
        if(Math.hypot(x-50,y-50)+r>47)continue;
        if(out.every(o=>Math.hypot(o.x-x,o.y-y)>=o.r+r)){out.push({id,x,y,W,H,r,rot:rnd(-55,55)});placed=true}
      }
      if(!placed){ok=false;break}
    }
    if(ok)return out;
    base*=.96;
  }
  return null;
}
function fill(card,ids){
  let L;do{L=layout(shuf(ids))}while(!L);
  card.innerHTML="";
  for(const o of L){
    const b=document.createElement("button");b.className="pic";b.dataset.id=o.id;b.setAttribute("aria-label",BY[o.id].word);
    b.style.cssText=`left:${o.x-o.W/2}%;top:${o.y-o.H/2}%;width:${o.W}%;height:${o.H}%;transform:rotate(${o.rot}deg)`;
    b.innerHTML=`<img src="${BY[o.id].src}" alt="${BY[o.id].word}" draggable="false">`;
    b.addEventListener("click",()=>pick(card.id,b));
    card.appendChild(b);
  }
}
function banner(t,c,sub){const b=$("#banner");b.className="show "+c;b.innerHTML=t+(sub?`<small>${sub}</small>`:"")}
function hide(){$("#banner").className=""}
function newRound(){
  sel=null;locked=false;hide();
  const common=plan[round],rest=shuf(IM.map(i=>i.id).filter(i=>i!==common));
  fill($("#A"),[common,...rest.slice(0,4)]);
  fill($("#B"),[common,...rest.slice(4,8)]);
  $("#rn").textContent=round+1;$("#bar").style.width=(round/TOTAL*100)+"%";
}
function pick(cid,el){
  if(locked)return;
  if(!sel||sel.card===cid){
    if(sel)sel.el.classList.remove("sel");
    sel={card:cid,el};el.classList.add("sel");return;
  }
  const a=sel.el,b=el;a.classList.remove("sel");sel=null;
  if(a.dataset.id===b.dataset.id){
    locked=true;a.classList.add("ok");b.classList.add("ok");
    score++;$("#sc").textContent=score;
    banner("Correct! Well done!","ok",BY[a.dataset.id].word);
    $("#bar").style.width=((round+1)/TOTAL*100)+"%";
    setTimeout(()=>{round++;round>=TOTAL?finish():newRound()},1700);
  }else{
    locked=true;a.classList.add("bad");b.classList.add("bad");banner("Try again!","bad");
    setTimeout(()=>{a.classList.remove("bad");b.classList.remove("bad");hide();locked=false},900);
  }
}
function finish(){$("#fin").textContent=`You scored ${score} out of ${TOTAL}!`;$("#end").classList.add("show")}
function start(){plan=makePlan();round=0;score=0;$("#sc").textContent=0;$("#end").classList.remove("show");newRound()}
$("#again").onclick=start;start();
</script></body></html>
